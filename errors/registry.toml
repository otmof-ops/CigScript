#
# The CigScript error-code registry: the one place a code is defined.
#
# Everything that talks about codes reads this file. The binary embeds it
# (`cig explain`, `--json` output, doctor's knowledge, the JSON schema);
# `docs/ERRORS.md` and `docs/diagnostic.schema.json` are generated from it by
# `scripts/gen-errors-doc.py`; `tests/registry.rs` fails the build when a code
# is emitted that is not here, when a code here is never emitted (unless it is
# tagged `planned`), or when an entry is missing any part of its page.
#
# Rules: a code never changes meaning; a retired code is never reused (mark it
# `retired = true` and keep it). Every code has a `fix` in the shape "what to
# type next", at least one ranked cause with a named read-only probe (or
# `none`), and a `no`: which of the four kinds of no it is, from the lexicon.
#
# A code is a node, not a number.

version = 1

# ----- ranges: a code's first digits decide its family and its kind ----------

[[range]]
from = "E100"
to = "E199"
family = "lex"
kind = "lex"
meaning = "lexing: the source cannot be turned into tokens"

[[range]]
from = "E200"
to = "E299"
family = "syntax"
kind = "syntax"
meaning = "parsing: the tokens do not follow the grammar"

[[range]]
from = "E300"
to = "E399"
family = "check"
kind = "check"
meaning = "static check (`cig check`): a mistake found before anything runs"

[[range]]
from = "E400"
to = "E499"
family = "type"
kind = "type"
meaning = "types and arity: a value of the wrong shape reached an operation"

[[range]]
from = "E500"
to = "E519"
family = "runtime"
kind = "runtime"
meaning = "runtime: a failure while the script was running, including the resource ceilings"

[[range]]
from = "E520"
to = "E529"
family = "ghost"
kind = "runtime"
meaning = "the ghost filesystem: dry-run reads of paths that simulated ops changed"

[[range]]
from = "E550"
to = "E569"
family = "hop"
kind = "runtime"
meaning = "hops (process boundaries): child processes and foreign scripts"

[[range]]
from = "E600"
to = "E699"
family = "cough"
kind = "cough"
meaning = "raised by the script: cough, assert, chains, process checks"

[[range]]
from = "E700"
to = "E749"
family = "kernel"
kind = "burn"
meaning = "the burn kernel and its journal (write-ahead log)"

[[range]]
from = "E750"
to = "E769"
family = "fold"
kind = "burn"
meaning = "folds and packs: refusals when automation is composed"

[[range]]
from = "E800"
to = "E849"
family = "usage"
kind = "usage"
meaning = "the command line and the environment"

[[range]]
from = "E850"
to = "E869"
family = "update"
kind = "usage"
meaning = "the updater and doctor"

[[range]]
from = "E900"
to = "E999"
family = "internal"
kind = "internal"
meaning = "internal: a bug in CigScript itself"

# ----- the four kinds of no (docs/LEXICON.md, "Scrounging a ciggy") ---------

[[no]]
id = "none"
hear = "not one of the four"
whose = "a mistake in the text, in the arithmetic, or in CigScript"
manual = "syntax, type or logic error; an internal error"

[[no]]
id = "cant-see-any"
hear = "can't see any ciggies bro"
whose = "yours: you're pointed at the wrong place"
manual = "wrong address: a path, a name, a directory not on PATH; ENOENT"

[[no]]
id = "never-heard-of-you"
hear = "never heard of you"
whose = "the door: it doesn't know you"
manual = "401 Unauthorized; authentication failure"

[[no]]
id = "these-are-mine"
hear = "these are MY ciggies"
whose = "the door: it knows you and said no"
manual = "403 Forbidden; permission denied; a lock; a refusal by policy"

[[no]]
id = "dont-have-any"
hear = "don't have any over here"
whose = "nobody's: right place, right you, nothing there"
manual = "404 from the server's side; an empty result"

[[no]]
id = "depends"
hear = "one of the four; the message says which"
whose = "read the operating-system reason in the message"
manual = "ENOENT, EACCES, ENOSPC and friends, each mapped in the causes below"

# ----- probes: the read-only checks doctor may run to confirm a cause --------
# A probe reads; it never writes, never re-runs the failing command and never
# touches the network. `none` means no probe can confirm the cause.

[[probe]]
name = "none"
reads = "nothing: the cause cannot be confirmed by looking, only suggested"

[[probe]]
name = "source-line"
reads = "the source line under the caret"

[[probe]]
name = "string-literal-scan"
reads = "the line the string opened on, looking for where the quote should close"

[[probe]]
name = "brace-balance"
reads = "the count of { and } per line, to find the block that never closed"

[[probe]]
name = "similar-names"
reads = "the names in scope, ranked by edit distance from the one used"

[[probe]]
name = "int-magnitude"
reads = "the literal's magnitude against the 64-bit range"

[[probe]]
name = "value-types"
reads = "the types of the operands, as the message reports them"

[[probe]]
name = "path-exists"
reads = "stat of the path named in the message"

[[probe]]
name = "path-permissions"
reads = "mode bits and owner of the path, or of its nearest existing ancestor"

[[probe]]
name = "parent-exists"
reads = "stat of the parent directory of the path"

[[probe]]
name = "path-is-dir"
reads = "whether the path is a directory, a file or a link"

[[probe]]
name = "disk-free"
reads = "free space on the filesystem holding the path or the state directory"

[[probe]]
name = "state-dir-writable"
reads = "whether the state directory (CIGSCRIPT_HOME or ~/.cigscript) can be written"

[[probe]]
name = "on-path"
reads = "each directory on PATH, looking for the program named in the message"

[[probe]]
name = "loop-condition"
reads = "the loop's condition on the line the budget ran out"

[[probe]]
name = "env-var"
reads = "an environment variable that changes the limit involved"

[[probe]]
name = "plan-order"
reads = "the dry-run plan, for the earlier op that took the path away"

[[probe]]
name = "chain-report"
reads = "the chain report: which step, its label, and the inner error"

[[probe]]
name = "snapshot-integrity"
reads = "every snapshot the run's journal needs, its presence and its hash"

[[probe]]
name = "file-hash"
reads = "the current hash of a file against the hash the journal recorded"

[[probe]]
name = "run-record"
reads = "run.json for the run: status, pid, totals"

[[probe]]
name = "pid-alive"
reads = "whether the run's process still exists"

[[probe]]
name = "run-list"
reads = "the run records under the state directory"

[[probe]]
name = "chain-list"
reads = "the chains the script declares"

[[probe]]
name = "network-tools"
reads = "whether gh and curl are on PATH"

[[probe]]
name = "release-manifest"
reads = "the cached release manifest and the checksum file for the asset"

[[probe]]
name = "crash-reports"
reads = "the crash reports saved under the state directory"

# ----- codes ------------------------------------------------------------------
# Per code: title, meaning, fix (what to type next), no, arises (where it can
# appear: parse, check, dry-run, run, light, unburn, runs, doctor, update,
# crash, any), tags, since (first version shipped), related, and ranked causes.
# Cause fields: why, probe, remedy, fixable (doctor can apply it with consent),
# needs_burn, reversible.

# --- lex (E1xx) ---

[[code]]
code = "E100"
title = "lexing error"
meaning = "The source contains something the lexer cannot turn into tokens."
fix = "fix the character or literal the message names; `cig language` shows the forms"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a character or literal the lexer does not know"
probe = "source-line"
remedy = "fix it at the caret"

[[code]]
code = "E101"
title = "unterminated string"
meaning = "A string literal has no closing quote on its line."
fix = "close the string on the same line, or write \\n for a newline inside it"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "the closing quote is missing, or sits on the next line"
probe = "string-literal-scan"
remedy = "close the string on the line it opened; use \\n for a line break inside it"
[[code.cause]]
why = 'an escaped quote \" swallowed the closing quote'
probe = "source-line"
remedy = "count the backslashes before the last quote; a raw 'single-quoted' string has no escapes"

[[code]]
code = "E102"
title = "unknown escape"
meaning = "A backslash sequence in a double-quoted string is not one CigScript knows."
fix = "use \\n \\t \\r \\0 \\\\ \\\" \\$ \\u{hex}; for a regex or a Windows path use a raw 'single-quoted' string"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a Windows path or a regex inside a double-quoted string"
probe = "source-line"
remedy = "write it as a raw 'single-quoted' string, which has no escapes at all"
[[code.cause]]
why = "a typo in an escape"
probe = "none"
remedy = 'the escapes are \n \t \r \0 \\ \" \$ and \u{hex}'

[[code]]
code = "E103"
title = "unexpected character"
meaning = "A character cannot start any token, often a C-style operator."
fix = "spell logic as `and`, `or`, `not`; comparisons are == != < <= > >="
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a C-style operator: && || !"
probe = "source-line"
remedy = "spell them `and`, `or`, `not`"
[[code.cause]]
why = "a smart quote or a non-breaking space pasted from a document; the message shows the character"
probe = "source-line"
remedy = "retype the character with a plain quote or space"

[[code]]
code = "E104"
title = "malformed number"
meaning = "A numeric literal does not fit in 64 bits or is not well formed."
fix = "use a float (add .0) for magnitudes beyond 9223372036854775807; -9223372036854775808 is valid with the minus directly in front"
no = "none"
arises = ["parse"]
since = "1.0.0"
related = ["E503"]
[[code.cause]]
why = "the literal is larger than 9223372036854775807"
probe = "int-magnitude"
remedy = "add .0 to make it a float, or check whether the number is right"
[[code.cause]]
why = "a stray character inside the number"
probe = "source-line"
remedy = "digits and single underscores only: 1_000_000"

# --- syntax (E2xx) ---

[[code]]
code = "E200"
title = "syntax error"
meaning = "The source does not follow the grammar."
fix = "look at the caret; the message says what was expected; `cig language` shows the forms"
no = "none"
arises = ["parse"]
since = "1.0.0"
[[code.cause]]
why = "parsing stopped at the caret, short of what was expected"
probe = "source-line"
remedy = "supply what was expected, or remove what was not"

[[code]]
code = "E201"
title = "expected an expression"
meaning = "A value was expected here and something else was found."
fix = "complete the expression; look for a trailing operator or comma"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a trailing operator or comma with nothing after it"
probe = "source-line"
remedy = "finish the expression, or delete the operator"
[[code.cause]]
why = "a keyword used where a value should be"
probe = "source-line"
remedy = "keywords are fine as map keys and member names, not as values"

[[code]]
code = "E202"
title = "unclosed block"
meaning = "A `{` has no matching `}`."
fix = "add the closing brace where the block ends"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a block opened and never closed"
probe = "brace-balance"
remedy = "add `}` at the end of that block"

[[code]]
code = "E203"
title = "expected end of statement"
meaning = "Two statements share a line without a separator."
fix = "put each statement on its own line, or separate them with `;`"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "two statements on one line"
probe = "source-line"
remedy = "put each statement on its own line, or separate them with `;`"

[[code]]
code = "E204"
title = "not a statement"
meaning = "A word that is not a keyword starts the line, usually a typo."
fix = "use the spelling the hint suggests; `cig language` lists the keywords"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a typo in a keyword"
probe = "similar-names"
remedy = "use the suggestion in the hint"
[[code.cause]]
why = "a word from another language: let, var, const, def, function"
probe = "none"
remedy = "`roll` for a variable, `stick` for a constant, `pull` for a function, `pack` for a lambda"

[[code]]
code = "E205"
title = "invalid assignment target"
meaning = "The left side of `=` is not something that can hold a value."
fix = "assign to a name, `list[i]` or `map.key`"
no = "none"
arises = ["parse"]
since = "1.0.0"
[[code.cause]]
why = "assigning to a call result or a literal"
probe = "source-line"
remedy = "assign to a name, `list[i]` or `map.key`"
[[code.cause]]
why = "`=` where `==` was meant, inside a condition"
probe = "source-line"
remedy = "write `==` to compare"

[[code]]
code = "E206"
title = "chained comparison"
meaning = "Comparisons cannot be chained like `a < b < c`."
fix = "write `a < b and b < c`"
no = "none"
arises = ["parse"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "`a < b < c` read as one expression"
probe = "source-line"
remedy = "write `a < b and b < c`"

[[code]]
code = "E207"
title = "empty chain"
meaning = "A chain declares no steps."
fix = "list the sticks (steps) to light: chain name { fetch, build }"
no = "none"
arises = ["parse"]
since = "1.0.0"
[[code.cause]]
why = "`chain name { }` with nothing inside"
probe = "source-line"
remedy = "put the steps inside, one per line or comma-separated"

[[code]]
code = "E208"
title = "nesting too deep"
meaning = "Brackets, parentheses or blocks nest deeper than 5,000 levels, or more than 10,000 operators are chained in one expression; the parser refuses rather than run out of stack."
fix = "flatten it; a value this deep is better built in a loop"
no = "none"
arises = ["parse"]
since = "1.1.1"
[[code.cause]]
why = "generated or pasted code with thousands of open brackets"
probe = "source-line"
remedy = "build the structure in a loop, or split it across statements"

# --- check (E3xx) ---
[[code.cause]]
why = "a generated expression with tens of thousands of chained operators"
probe = "source-line"
remedy = "split it across statements, or build the value in a loop"

[[code]]
code = "E300"
title = "check error"
meaning = "The static checker found a mistake before running anything."
fix = "read the message; `cig check` shows all of them at once"
no = "none"
arises = ["check"]
since = "1.0.0"
[[code.cause]]
why = "the checker found the mistake at the line shown"
probe = "source-line"
remedy = "fix it there; `cig check <file>` lists every one"

[[code]]
code = "E301"
title = "unknown name"
meaning = "A name is used that was never declared in a visible scope."
fix = "use the name the hint suggests, or declare it with `roll` or `stick` above this line"
no = "cant-see-any"
arises = ["check"]
tags = ["beginner-likely"]
since = "1.0.0"
related = ["E307", "E501"]
[[code.cause]]
why = "a typo in the name"
probe = "similar-names"
remedy = "use the suggested name"
[[code.cause]]
why = "the name is declared later in the file, or inside another block"
probe = "none"
remedy = "move the declaration above the first use, or out of the inner block"
[[code.cause]]
why = "a module function called without its module: read_text instead of fs.read_text"
probe = "similar-names"
remedy = "prefix it with the module; `cig language` lists them"

[[code]]
code = "E302"
title = "stick reassigned"
meaning = "A `stick` is a constant and cannot be assigned again."
fix = "declare it with `roll` if it needs to change"
no = "these-are-mine"
arises = ["check"]
tags = ["beginner-likely"]
since = "1.0.0"
related = ["E507"]
[[code.cause]]
why = "a stick (constant binding) assigned a second time"
probe = "source-line"
remedy = "declare it with `roll`; a stick is a promise that it will not change"

[[code]]
code = "E303"
title = "effect outside burn"
meaning = "A function that changes the world is called where no `burn` block encloses it."
fix = "wrap the call in burn { ... }; inside a pull this is a warning, since the caller may burn"
no = "these-are-mine"
arises = ["check"]
tags = ["beginner-likely", "kernel"]
since = "1.0.0"
related = ["E701"]
[[code.cause]]
why = "a world-changing call at the top level with no burn { } around it"
probe = "source-line"
remedy = "wrap the call in burn { ... }, or the call to the function that makes it"
[[code.cause]]
why = "inside a pull or pack: a warning, because the caller may burn"
probe = "none"
remedy = "nothing, if every caller burns; wrap it if the function should work from anywhere"

[[code]]
code = "E304"
title = "snuff outside a function"
meaning = "`snuff` returns from a pull or pack and was used at the top level."
fix = "use exit(code) to stop the script"
no = "none"
arises = ["check"]
since = "1.0.0"
[[code.cause]]
why = "`snuff` (return) at the top level of the script"
probe = "source-line"
remedy = "use exit(code), or move the code into a pull"

[[code]]
code = "E305"
title = "break outside a loop"
meaning = "`break` or `continue` appears outside `while` or `for`."
fix = "move it inside the loop, or restructure with `if`"
no = "none"
arises = ["check"]
since = "1.0.0"
[[code.cause]]
why = "`break` or `continue` outside `while` or `for`"
probe = "source-line"
remedy = "move it inside the loop, or restructure with `if`"

[[code]]
code = "E306"
title = "already declared"
meaning = "A name is declared twice in the same scope."
fix = "assign with `name = ...` the second time, or choose another name"
no = "none"
arises = ["check"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "`roll x` twice in one scope"
probe = "source-line"
remedy = "write `x = ...` the second time"

[[code]]
code = "E307"
title = "unknown module member"
meaning = "A module such as `fs` has no function by that name."
fix = "use the member the hint suggests; `cig language` lists every one"
no = "cant-see-any"
arises = ["check"]
tags = ["beginner-likely"]
since = "1.0.0"
related = ["E301"]
[[code.cause]]
why = "a typo in the member: fs.read_txt"
probe = "similar-names"
remedy = "use the suggestion in the hint"
[[code.cause]]
why = "a function from another language's library"
probe = "none"
remedy = "`cig language` shows what exists; text.*, fs.* and path.* cover most needs"

# --- types (E4xx) ---

[[code]]
code = "E308"
title = "shell through proc.run"
meaning = "proc.run is handed a shell (`sh -c`, `bash -c`, `cmd /C`) with a command string built at run time; that is where every injection bug in every glue script has lived."
fix = "call the program directly with its arguments as a list; proc.pipe for a pipeline; proc.shell if you mean the shell and the string is yours"
no = "none"
arises = ["check"]
tags = ["ci-likely"]
since = "1.1.0"
[[code.cause]]
why = "a value that came from outside the script is spliced into a shell command"
probe = "source-line"
remedy = "pass the value as its own argument to the program; the shell never sees it"

[[code]]
code = "E400"
title = "type error"
meaning = "A value of the wrong type reached an operation."
fix = "convert with str(), int() or float(), or test with type_of()"
no = "none"
arises = ["run"]
since = "1.0.0"
[[code.cause]]
why = "a value of the type the message names"
probe = "value-types"
remedy = "convert the value first, or branch on type_of()"

[[code]]
code = "E401"
title = "wrong number of arguments"
meaning = "A call passes more or fewer arguments than the function takes."
fix = "match the signature; packs have no optional parameters, pass null explicitly"
no = "none"
arises = ["run"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "the call passes more or fewer arguments than the pack or pull declares"
probe = "source-line"
remedy = "match the declaration; pass null for an argument you do not have"
[[code.cause]]
why = "a method called on the wrong receiver, so the receiver counted as an argument"
probe = "none"
remedy = "check what the dot is applied to"

[[code]]
code = "E402"
title = "wrong argument type"
meaning = "A library function received an argument of the wrong type."
fix = "convert the value first: str(n), int(s), or path.join for paths"
no = "none"
arises = ["run"]
since = "1.0.0"
[[code.cause]]
why = "an argument of the wrong type, at the position the message names"
probe = "value-types"
remedy = "convert the value first: str(n), int(s), float(s)"

[[code]]
code = "E403"
title = "operator not applicable"
meaning = "An operator was applied to types it does not support."
fix = "strings join with +, numbers add; convert first with str() or int()"
no = "none"
arises = ["run"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "a string plus a number"
probe = "value-types"
remedy = 'interpolate: "count: ${n}", or str(n) + "..."'
[[code.cause]]
why = "arithmetic on null from a missing key or a ?. chain"
probe = "value-types"
remedy = "give it a default: x ?? 0"

[[code]]
code = "E404"
title = "not callable"
meaning = "Something that is not a function was called."
fix = "only packs, pulls and library functions can be called"
no = "none"
arises = ["run"]
since = "1.0.0"
[[code.cause]]
why = "a name that holds a value, not a function, followed by ()"
probe = "value-types"
remedy = "drop the parentheses, or call the function you meant"
[[code.cause]]
why = "a module called as a function: fs()"
probe = "source-line"
remedy = "call a member: fs.read_text(...)"

[[code]]
code = "E405"
title = "not indexable or iterable"
meaning = "Indexing or iteration was attempted on an unsupported type."
fix = "lists, strings and maps support [] and for; check type_of()"
no = "none"
arises = ["run"]
since = "1.0.0"
[[code.cause]]
why = "indexing or looping over null, a number or a bool"
probe = "value-types"
remedy = "check type_of(x); a missing key or an empty glob is the usual source of the null"

# --- runtime (E50x, E51x) ---

[[code]]
code = "E500"
title = "runtime error"
meaning = "Something failed while the script was running."
fix = "read the message; wrap risky code in try/ashtray to handle it"
no = "none"
arises = ["run"]
since = "1.0.0"
[[code.cause]]
why = "the operation the message names failed"
probe = "none"
remedy = "wrap the risky code in try/ashtray to handle it"

[[code]]
code = "E501"
title = "unknown name at run time"
meaning = "A name was looked up that is not in scope."
fix = "run `cig check`; it finds this before anything runs"
no = "cant-see-any"
arises = ["run"]
since = "1.0.0"
related = ["E301"]
[[code.cause]]
why = "the check was skipped with --no-check"
probe = "none"
remedy = "run `cig check <file>`"

[[code]]
code = "E502"
title = "division by zero"
meaning = "An integer or float was divided by zero, or the modulus was zero."
fix = "guard the divisor: if d != 0 { ... }"
no = "none"
arises = ["run"]
tags = ["beginner-likely"]
since = "1.0.0"
[[code.cause]]
why = "the divisor was zero, from data that was zero or empty"
probe = "value-types"
remedy = "guard it: if d != 0 { ... }, or give it a default with ??"

[[code]]
code = "E503"
title = "integer overflow"
meaning = "An integer operation left the 64-bit range."
fix = "use floats (1.0 * n) for very large magnitudes, or check bounds first"
no = "none"
arises = ["run"]
since = "1.0.0"
related = ["E104"]
[[code.cause]]
why = "a multiplication or a running sum left the 64-bit range"
probe = "value-types"
remedy = "use floats for the large magnitude, or check the bound before the operation"
[[code.cause]]
why = "negating -9223372036854775808, which has no positive twin"
probe = "value-types"
remedy = "use a float"
[[code.cause]]
why = "int() of a float or a numeric string beyond the 64-bit range (1e300)"
probe = "value-types"
remedy = "keep it a float, or clamp it first"

[[code]]
