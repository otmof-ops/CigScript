code = "E752"
title = "hop wrote outside the pack"
meaning = "A child process changed files in its working directory outside the declared pack. The kernel cannot undo them; they are listed so nothing is hidden. Writes elsewhere are not watched at all: the hop's irreversible label is their only record."
fix = "point the program at the pack (its cwd, an output flag), or add the root it wrote to"
no = "these-are-mine"
arises = ["run", "light"]
tags = ["kernel", "irreversible-involved"]
since = "1.1.0"
related = ["E751"]
[[code.cause]]
why = "the program writes to its working directory, which is not in the pack"
probe = "none"
remedy = "run it with {cwd: <a pack root>}, or add that directory to pack { }"

[[code]]
code = "E753"
title = "pack misplaced"
meaning = "pack { } must be the first statement of a script and appear once: the scope is declared before anything can burn."
fix = "move pack { } to the top of the file and keep one"
no = "none"
arises = ["check"]
since = "1.1.0"
related = ["E750"]
[[code.cause]]
why = "a second pack { }, or one below other statements"
probe = "source-line"
remedy = "one pack { }, first line after the comments"

[[code]]
code = "E754"
title = "compensation reaches outside its state"
meaning = "An unburn { } block refers to a name that is not its state map, a module or a builtin. Compensations run later, in another process, from the journal alone, so they may use only what was put in the state."
fix = "put the value in the state map inside the burn block (burn (s) { s.sha = ... }) and read s.sha in unburn { }"
no = "none"
arises = ["check"]
since = "1.1.0"
[[code.cause]]
why = "the compensation uses a variable from the surrounding script"
probe = "source-line"
remedy = "copy it into the state map in the burn block; the map is journaled with the compensation"

[[code]]
code = "E755"
title = "bad pack root"
meaning = "A pack root is empty, which would have meant the whole working directory; the pack is refused before anything runs."
fix = "name the directory the script may write in, pack { \"./build\" }"
no = "none"
arises = ["check", "run"]
since = "1.1.1"
related = ["E750", "E751"]
[[code.cause]]
why = "pack { \"\" }, or a root computed from an empty string"
probe = "source-line"
remedy = "give the root a name; an empty string is not a directory"

[[code]]
code = "E756"
title = "fold shape mismatch"
meaning = "A folded unit is lit with the wrong number or names of arguments; the error names the unit, the caller and the mismatch."
fix = "match the declaration"
no = "none"
arises = ["check"]
tags = ["planned"]
since = "1.1.0"
[[code.cause]]
why = "the caller and the folded unit disagree on parameters"
probe = "source-line"
remedy = "match the declaration"

# --- usage (E80x) ---

[[code]]
code = "E800"
title = "usage error"
meaning = "The command line or the environment is wrong."
fix = "`cig --help`, or `cig <command> --help`"
no = "none"
arises = ["any"]
since = "1.0.0"
[[code.cause]]
why = "an argument or setting is wrong"
probe = "none"
remedy = "`cig <command> --help` shows the flags"
[[code.cause]]
why = "CIG_MAX_STEPS is set to something other than a whole number"
probe = "none"
remedy = "give a whole number of steps, or 0 to disable the budget"
[[code.cause]]
why = "cig crash send while crash_reports is \"never\""
probe = "none"
remedy = "cig config crash_reports ask, then send it again"

[[code]]
code = "E801"
title = "cannot read script"
meaning = "The script file could not be opened."
fix = "check the path; scripts resolve against the current directory"
no = "depends"
arises = ["run", "check", "light"]
since = "1.0.0"
[[code.cause]]
why = "the path is wrong, or relative to another directory"
no = "cant-see-any"
probe = "path-exists"
remedy = "ls the path; run from the directory the script lives in, or give the full path"
[[code.cause]]
why = "permission denied"
no = "these-are-mine"
probe = "path-permissions"
remedy = "chmod +r the file"
[[code.cause]]
why = "the path is a device or something larger than 64 MiB, which no script is"
probe = "path-is-dir"
remedy = "give the script file's path"

[[code]]
code = "E802"
title = "state directory unavailable"
meaning = "The state directory cannot be created or written."
fix = "set CIGSCRIPT_HOME to a writable location; `cig doctor` shows which one is in use"
no = "these-are-mine"
arises = ["any"]
since = "1.0.0"
related = ["E702"]
[[code.cause]]
why = "~/.cigscript (or CIGSCRIPT_HOME) cannot be created or written"
probe = "state-dir-writable"
remedy = "set CIGSCRIPT_HOME to a directory you own"

[[code]]
code = "E803"
title = "no such run"
meaning = "No run record matches the id or prefix given."
fix = "`cig runs` lists them; give more of the id if it is ambiguous"
no = "cant-see-any"
arises = ["unburn", "runs"]
since = "1.0.0"
[[code.cause]]
why = "a typo, or a prefix that matches nothing or several runs"
probe = "run-list"
remedy = "`cig runs` lists them; give more of the id"
[[code.cause]]
why = "the run was pruned"
probe = "run-list"
remedy = "nothing to restore from; `cig runs --prune N` keeps the newest N"

[[code]]
code = "E804"
title = "no such chain"
meaning = "The script declares no chain by that name."
fix = "`cig chains <file>` lists them"
no = "cant-see-any"
arises = ["light"]
since = "1.0.0"
[[code.cause]]
why = "the script declares no chain by that name"
probe = "chain-list"
remedy = "`cig chains <file>` lists them"

[[code]]
code = "E805"
title = "network tool missing"
meaning = "Neither `gh` nor `curl` is available for the update or report."
fix = "install curl or gh; `cig doctor --fix` offers to"
no = "dont-have-any"
arises = ["update"]
since = "1.0.0"
[[code.cause]]
why = "neither gh nor curl is on PATH"
probe = "network-tools"
remedy = "install curl from any package manager, or gh; `cig doctor --fix` offers to"

[[code]]
code = "E806"
title = "update failed"
meaning = "The release could not be fetched, verified or installed."
fix = "the message says which step; retry, or install from the releases page"
no = "depends"
arises = ["update"]
since = "1.0.0"
[[code.cause]]
why = "no network, or the release host refused"
probe = "none"
remedy = "retry; `cig update --check` shows what it can reach"
[[code.cause]]
why = "the checksum did not match: nothing was installed"
probe = "release-manifest"
remedy = "retry once; report it if it repeats, since a mismatch means the download is not what was published"
[[code.cause]]
why = "the install directory is not writable, or is group-writable (refused for safety)"
probe = "path-permissions"
remedy = "chown or chmod the directory holding cig, or install to a directory only you can write"

# --- internal (E9xx) ---

[[code]]
code = "E900"
title = "internal error"
meaning = "CigScript hit a condition it believes impossible."
fix = "please report it: `cig crash send` after the crash, or file an issue with the script"
no = "none"
arises = ["any"]
since = "1.0.0"
[[code.cause]]
why = "a bug in CigScript; nothing you wrote should be able to cause this"
probe = "none"
remedy = "file an issue with the script and the message; the crash pipeline makes this one command"

[[code]]
code = "E901"
title = "crash"
meaning = "CigScript panicked. A crash report was written locally."
fix = "`cig crash list` then `cig crash send <id>`, or say yes at the prompt"
no = "none"
arises = ["any"]
since = "1.0.0"
[[code.cause]]
why = "CigScript panicked; a redacted report was written under the state directory"
probe = "crash-reports"
remedy = "`cig crash list`, then `cig crash send <id>`; you can read the file first, it is plain JSON"
