#
# Contributor licence agreement check (CLA Assistant Lite). A pull request
# from a new contributor is blocked until they comment
#   I have read the CLA Document and I hereby sign the CLA
# Signatures are recorded in .github/CLA/signatures.json on main, committed
# by the action with the workflow's own token, so the repository keeps one
# branch and needs no secret.
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/CLA/signatures.json
          path-to-document: https://github.com/otmof-ops/CigScript/blob/main/.github/CLA/ICLA.md
          branch: main
          allowlist: otmof-ops,bot*
