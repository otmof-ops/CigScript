<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="A chain: four sticks lit one from the last, fetch, build, test, ship; the fourth is burning.">
  <title>chain release { fetch, build, test, ship }</title>
  <defs>
    <radialGradient id="ember2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #6b7280; }
    .k { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #9ca3af; }
    .h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #f97316; }
    .link { stroke: #9ca3af; stroke-width: 1.8; fill: none; marker-end: url(#a2); }
  </style>
  <text x="24" y="34" class="h">chain release { fetch, build, test, ship }</text>
  <text x="24" y="54" class="k">each stick lit from the last; a failure stops the chain, and the kernel puts everything back</text>

  <!-- four sticks -->
  <g id="s1" transform="translate(40 96)">
    <rect x="70" y="10" width="34" height="22" rx="5" fill="#d6b370"/>
    <rect x="16" y="10" width="54" height="22" rx="5" fill="#e5e7eb" stroke="#d1d5db"/>
    <path d="M 4 21 q 3 -7 12 -8 q -5 5 -2 16 q -7 -1 -10 -8 z" fill="#9ca3af"/>
    <text x="60" y="58" text-anchor="middle" class="m">fetch</text>
    <text x="60" y="76" text-anchor="middle" class="k">ok, 812 ms</text>
  </g>
  <path d="M 150 117 L 218 117" class="link"/>
  <g transform="translate(224 96)">
    <rect x="70" y="10" width="34" height="22" rx="5" fill="#d6b370"/>
    <rect x="16" y="10" width="54" height="22" rx="5" fill="#e5e7eb" stroke="#d1d5db"/>
    <path d="M 4 21 q 3 -7 12 -8 q -5 5 -2 16 q -7 -1 -10 -8 z" fill="#9ca3af"/>
    <text x="60" y="58" text-anchor="middle" class="m">build</text>
    <text x="60" y="76" text-anchor="middle" class="k">ok, 41 s</text>
  </g>
  <path d="M 334 117 L 402 117" class="link"/>
  <g transform="translate(408 96)">
    <rect x="70" y="10" width="34" height="22" rx="5" fill="#d6b370"/>
    <rect x="16" y="10" width="54" height="22" rx="5" fill="#e5e7eb" stroke="#d1d5db"/>
    <path d="M 4 21 q 3 -7 12 -8 q -5 5 -2 16 q -7 -1 -10 -8 z" fill="#9ca3af"/>
    <text x="60" y="58" text-anchor="middle" class="m">test</text>
    <text x="60" y="76" text-anchor="middle" class="k">ok, 4 s</text>
  </g>
  <path d="M 518 117 L 586 117" class="link"/>
  <g transform="translate(592 96)">
    <rect x="70" y="10" width="34" height="22" rx="5" fill="#d6b370"/>
    <rect x="16" y="10" width="54" height="22" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
    <circle cx="17" cy="21" r="11" fill="url(#ember2)"/>
    <circle cx="17" cy="21" r="17" fill="#f97316" opacity="0.15"/>
    <g fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round">
      <path d="M 14 6 C 6 0, 22 -6, 14 -14"/>
      <path d="M 22 4 C 30 -4, 16 -8, 24 -16"/>
    </g>
    <text x="60" y="58" text-anchor="middle" class="m">ship</text>
    <text x="60" y="76" text-anchor="middle" class="h">burning</text>
  </g>
  <text x="24" y="188" class="k">$ cig light tasks.cig release      # or: light(release, {retries: 2})</text>
</svg>
