<svg xmlns="http://www.w3.org/2000/svg" width="480" height="132" viewBox="0 0 480 132" role="img" aria-label="CigScript">
  <title>CigScript</title>
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <!-- smoke: three wisps, drawn as calm curves -->
  <g fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <path d="M 42 44 C 30 34, 54 26, 42 16"/>
    <path d="M 50 40 C 62 30, 40 24, 52 12"/>
    <path d="M 34 48 C 24 40, 36 32, 30 22"/>
  </g>
  <!-- the stick: filter, paper, ember -->
  <g transform="translate(24 56)">
    <rect x="100" y="8" width="56" height="26" rx="6" fill="#d6b370"/>
    <rect x="102" y="12" width="52" height="4" fill="#c8a25f" opacity="0.6"/>
    <rect x="102" y="24" width="52" height="4" fill="#c8a25f" opacity="0.6"/>
    <rect x="18" y="8" width="84" height="26" rx="6" fill="url(#paper)" stroke="#d1d5db" stroke-width="1.5"/>
    <circle cx="19" cy="21" r="14" fill="url(#ember)"/>
    <circle cx="19" cy="21" r="20" fill="#f97316" opacity="0.14"/>
    <!-- ash -->
    <path d="M 6 21 q 3 -8 12 -9 q -6 6 -2 18 q -8 -1 -10 -9 z" fill="#9ca3af" opacity="0.9"/>
  </g>
  <!-- wordmark -->
  <text x="210" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#6b7280" letter-spacing="-1">Cig<tspan fill="#f97316">Script</tspan></text>
  <text x="212" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9ca3af">nothing real happens unless you burn</text>
</svg>
