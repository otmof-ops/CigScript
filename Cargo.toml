[package]
name = "cigscript"
version = "1.6.1"
edition = "2021"
rust-version = "1.82"
description = "CigScript: a small scripting language where nothing real happens unless you burn"
license = "Apache-2.0"
repository = "https://github.com/otmof-ops/CigScript"
readme = "README.md"
keywords = ["scripting", "language", "automation", "rollback", "dry-run"]
categories = ["command-line-utilities", "development-tools"]
default-run = "cig"

[lib]
name = "cigscript"
path = "src/lib.rs"

[[bin]]
name = "cig"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
globset = "0.4"
walkdir = "2"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wait-timeout = "0.2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
fastcdc = { version = "3", default-features = false }
chacha20poly1305 = { version = "0.10", features = ["stream", "getrandom"] }
getrandom = "0.2"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects: a hop's whole process tree ends with the hop on Windows.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
# Symbol names stay so a crash report's backtrace names the function (#23);
# only the DWARF line tables go.
strip = "debuginfo"
