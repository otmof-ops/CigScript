[package]
name = "cigscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "CigScript: a small scripting language where nothing real happens unless you burn"
license = "Apache-2.0"
repository = "https://github.com/otmof-ops/CigScript"
readme = "README.md"
keywords = ["scripting", "language", "automation", "rollback", "dry-run"]
categories = ["command-line-utilities", "development-tools"]
default-run = "cig"

[lib]
name = "cigscript"
path = "src/lib.rs"

[[bin]]
name = "cig"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
globset = "0.4"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
